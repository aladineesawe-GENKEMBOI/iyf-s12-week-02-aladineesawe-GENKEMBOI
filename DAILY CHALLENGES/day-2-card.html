<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Challenge 2 - Reusable Card</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header class="challenge-header">
        <h1>My Project Card</h1>
        <p>A reusable card component for displaying projects.</p>
    </header>

    <main class="card-challenge">
        <article class="challenge-card">
            <img
                src="https://placehold.co/600x400?text=Web+Development"
                alt="Web development project"
            >

            <div class="challenge-card-content">
                <h2>Web Development</h2>

                <p>
                    Building modern, responsive and user-friendly
                    websites using HTML, CSS and JavaScript.
                </p>

                <div class="card-tags">
                    <span>HTML</span>
                    <span>CSS</span>
                    <span>JavaScript</span>
                </div>

                <a href="../projects.html" class="button">
                    View Projects
                </a>
            </div>
        </article>
    </main>

</body>
</html>
